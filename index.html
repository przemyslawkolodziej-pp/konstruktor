<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konstruktor Rejonów</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <!-- Turf.js & SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f8f9fa; }
        header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.2rem; }
        .main-container { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; }
        #sidebar { width: 380px; background: white; border-right: 1px solid #ccc; display: flex; flex-direction: column; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar-content { padding: 15px; overflow-y: auto; flex: 1; }
        #map { flex: 1; height: 100%; }
        
        .section-title { font-size: 0.9rem; font-weight: bold; color: #7f8c8d; text-transform: uppercase; margin-bottom: 8px; margin-top: 15px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .section-title:first-child { margin-top: 0; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; width: 100%; padding: 8px 12px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; margin-bottom: 8px; transition: background 0.2s; font-size: 0.85rem; }
        .btn:hover { background: #2980b9; }
        .btn-secondary { background: #7f8c8d; }
        .btn-secondary:hover { background: #6c7a89; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: #e67e22; }
        .btn-warning:hover { background: #d35400; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        
        .row-btns { display: flex; gap: 8px; }
        .row-btns .btn { flex: 1; }

        .stat-card { background: #ecf0f1; border-radius: 4px; padding: 10px; margin-bottom: 10px; border-left: 4px solid #3498db; }
        .stat-card-title { font-size: 0.8rem; color: #555; }
        .stat-card-value { font-size: 1.1rem; font-weight: bold; color: #2c3e50; }

        .region-item { background: white; border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin-bottom: 8px; border-left: 5px solid #ccc; }
        .region-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .region-name { font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        .region-stats { font-size: 0.8rem; color: #666; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 5px; }
        
        .file-input-wrapper { position: relative; margin-bottom: 8px; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 2px; }
        .form-group select, .form-group input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper { border-radius: 6px; padding: 0; overflow: hidden; }
        .leaflet-popup-content { margin: 0; width: 260px !important; }
        .popup-container { padding: 12px; }
        .popup-title { font-weight: bold; font-size: 0.95rem; color: #2c3e50; margin-bottom: 4px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .popup-info { font-size: 0.8rem; color: #555; margin-bottom: 8px; line-height: 1.4; }
        .popup-actions { display: flex; flex-direction: column; gap: 5px; }
        .btn-popup-action { padding: 5px 8px; font-size: 0.75rem; border: none; border-radius: 3px; cursor: pointer; color: white; background: #3498db; text-align: center; }
        .btn-popup-action:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <h1>Konstruktor Rejonów v2.0</h1>
        <div id="header-status" style="font-size: 0.85rem; opacity: 0.8;">Brak wczytanych danych</div>
    </header>

    <div class="main-container">
        <div id="sidebar">
            <div class="sidebar-content">
                
                <div class="section-title">Wczytywanie Danych</div>
                <div class="file-input-wrapper">
                    <button class="btn btn-secondary">📁 Wczytaj Plik Excel / CSV</button>
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv">
                </div>

                <div class="section-title">Konfiguracja Kolumn</div>
                <div class="form-group">
                    <label for="col-lat">Szerokość (Lat) / Adres:</label>
                    <select id="col-lat"></select>
                </div>
                <div class="form-group">
                    <label for="col-lng">Długość (Lng):</label>
                    <select id="col-lng"></select>
                </div>
                <div class="form-group">
                    <label for="col-title">Etykieta Punkty / Opis:</label>
                    <select id="col-title"></select>
                </div>
                <button class="btn btn-warning" id="btn-apply-columns">🔄 Mapuj i Rysuj Punkty</button>

                <div class="section-title">Ogólne Podsumowanie</div>
                <div class="stat-card">
                    <div class="stat-card-title">Wszystkie Punkty / W Rejonach</div>
                    <div class="stat-card-value" id="stat-total-points">0 / 0</div>
                </div>

                <div class="section-title">Zarządzanie Historią</div>
                <div class="row-btns">
                    <button class="btn btn-secondary" id="btn-undo">↩️ Cofnij</button>
                    <button class="btn btn-secondary" id="btn-redo">↪️ Ponów</button>
                </div>

                <div class="section-title">Lista Rejonów</div>
                <div id="regions-list">
                    <div style="font-size: 0.8rem; color: #888; text-align: center;">Narysuj obszar na mapie, aby utworzyć rejon.</div>
                </div>

                <div class="section-title">Eksport Danych</div>
                <button class="btn btn-success" id="btn-export-excel">📊 Eksportuj do Excela</button>
                <button class="btn btn-danger" id="btn-clear-all">🗑️ Wyczyść Wszystko</button>

            </div>
        </div>

        <div id="map"></div>
    </div>

    <!-- Leaflet & Leaflet Draw JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        // --- ZMIENNE GLOBALNE I STAN ---
        let map;
        let drawnItems; // Warstwa z rysowanymi rejonami (poligony/prostokąty)
        let pointsGroup; // Warstwa z punktami/markerami
        let rawData = []; // Surowe dane z pliku Excel/CSV
        let loadedMarkers = []; // Tablica obiektów markerów Leaflet
        let historyStack = []; // Historia zmian (Undo)
        let redoStack = []; // Historia zmian (Redo)
        const MAX_HISTORY = 20;

        // Paleta kolorów dla rejonów
        const regionColors = [
            '#3498db', '#2ecc71', '#e74c3c', '#f1c40f', '#9b59b6', 
            '#1abc9c', '#e67e22', '#34495e', '#d35400', '#c0392b'
        ];

        // --- INICJALIZACJA MAPY ---
        function initMap() {
            map = L.map('map').setView([52.2297, 21.0122], 6); // Domyślnie Polska

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            pointsGroup = new L.FeatureGroup();
            map.addLayer(pointsGroup);

            // Inicjalizacja narzędzi rysowania
            const drawControl = new L.Control.Draw({
                draw: {
                    polyline: false,
                    circle: false,
                    circlemarker: false,
                    marker: false,
                    polygon: { allowIntersection: false, showArea: true },
                    rectangle: true
                },
                edit: {
                    featureGroup: drawnItems,
                    remove: true
                }
            });
            map.addControl(drawControl);

            // Obsługa zdarzeń rysowania
            map.on(L.Draw.Event.CREATED, onRegionCreated);
            map.on(L.Draw.Event.EDITED, onRegionEdited);
            map.on(L.Draw.Event.DELETED, onRegionDeleted);

            // Wczytaj zapisaną historię/stan z localStorage jeśli istnieje
            loadFromLocalStorage();
        }

        // --- OBSŁUGA PLIKÓW EXCEL/CSV ---
        document.getElementById('excel-file-input').addEventListener('change', handleFileUpload);

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (rawData.length === 0) {
                        alert("Plik jest pusty!");
                        return;
                    }

                    populateColumnSelects(rawData[0]);
                    document.getElementById('header-status').innerText = `Wczytano ${rawData.length} wierszy`;
                    autoMapColumns(rawData[0]);
                } catch (err) {
                    alert("Błąd podczas odczytu pliku: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function populateColumnSelects(firstRow) {
            const keys = Object.keys(firstRow);
            const selects = ['col-lat', 'col-lng', 'col-title'];

            selects.forEach(id => {
                const select = document.getElementById(id);
                select.innerHTML = '<option value="">-- Wybierz kolumnę --</option>';
                keys.forEach(key => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.innerText = key;
                    select.appendChild(opt);
                });
            });
        }

        function autoMapColumns(firstRow) {
            const keys = Object.keys(firstRow);
            
            const latKeywords = ['lat', 'szerokosc', 'latitude', 'y', 'adres'];
            const lngKeywords = ['lng', 'lon', 'dlugosc', 'longitude', 'x'];
            const titleKeywords = ['nazwa', 'tytul', 'label', 'opis', 'id', 'klient', 'adres'];

            keys.forEach(k => {
                const lower = k.toLowerCase();
                if (!document.getElementById('col-lat').value && latKeywords.some(kw => lower.includes(kw))) {
                    document.getElementById('col-lat').value = k;
                }
                if (!document.getElementById('col-lng').value && lngKeywords.some(kw => lower.includes(kw))) {
                    document.getElementById('col-lng').value = k;
                }
                if (!document.getElementById('col-title').value && titleKeywords.some(kw => lower.includes(kw))) {
                    document.getElementById('col-title').value = k;
                }
            });
        }

        // --- MAPOWANIE PUNKTÓW NA MAPIE ---
        document.getElementById('btn-apply-columns').addEventListener('click', () => {
            if (rawData.length === 0) {
                alert("Najpierw wczytaj plik Excel/CSV!");
                return;
            }
            renderPointsFromData();
            recordState();
        });

        async function renderPointsFromData() {
            pointsGroup.clearLayers();
            loadedMarkers = [];

            const colLat = document.getElementById('col-lat').value;
            const colLng = document.getElementById('col-lng').value;
            const colTitle = document.getElementById('col-title').value;

            if (!colLat) {
                alert("Wybierz przynajmniej kolumnę ze współrzędną Szerokości (Lat) lub Adresem!");
                return;
            }

            let validPoints = 0;
            const bounds = [];

            for (let i = 0; i < rawData.length; i++) {
                const row = rawData[i];
                let lat = parseFloat(row[colLat]);
                let lng = parseFloat(row[colLng]);
                let title = row[colTitle] || `Punkt #${i+1}`;

                // Obsługa przypadku, gdy w kolumnie Lat podano adres tekstowy
                if ((isNaN(lat) || isNaN(lng)) && typeof row[colLat] === 'string' && row[colLat].trim() !== '') {
                    // Próba automatycznego geokodowania dla pojedynczych braków (opcjonalnie)
                    const geocoded = await geocodeAddressLive(row[colLat]);
                    if (geocoded) {
                        lat = geocoded.lat;
                        lng = geocoded.lng;
                    }
                }

                if (!isNaN(lat) && !isNaN(lng)) {
                    const marker = createInteractiveMarker(lat, lng, title, row);
                    pointsGroup.addLayer(marker);
                    loadedMarkers.push(marker);
                    bounds.push([lat, lng]);
                    validPoints++;
                }
            }

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }

            recalculateAllStats();
            saveToLocalStorage();
        }

        // --- GEOKODOWANIE ADRESU Z RESTRIKCJĄ DO POLIGONU REJONU ---
        async function geocodeAddressLive(addressQuery, targetRegionLayer = null) {
            try {
                let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addressQuery)}`;
                
                // 1. Ograniczenie widoku wyszukiwania (viewbox) do prostokąta otaczającego rejon
                if (targetRegionLayer) {
                    const bounds = targetRegionLayer.getBounds();
                    const minLon = bounds.getWest();
                    const maxLon = bounds.getEast();
                    const minLat = bounds.getSouth();
                    const maxLat = bounds.getNorth();

                    url += `&viewbox=${minLon},${maxLat},${maxLon},${minLat}&bounded=1`;
                }

                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    // 2. Weryfikacja dokładna – sprawdzenie, czy zwrócony punkt naprawdę leży wewnątrz rejonu
                    if (targetRegionLayer) {
                        const geoJson = targetRegionLayer.toGeoJSON();
                        
                        for (const item of data) {
                            const candidateLatLng = L.latLng(parseFloat(item.lat), parseFloat(item.lon));
                            const turfPoint = turf.point([candidateLatLng.lng, candidateLatLng.lat]);
                            
                            if (turf.booleanPointInPolygon(turfPoint, geoJson)) {
                                return candidateLatLng; // Zwraca tylko jeśli leży W EWIDENTNYM WNĘTRZU rejonu
                            }
                        }
                        // Jeśli żaden ze znalezionych wyników nie wpadł do rejonu:
                        return null;
                    } else {
                        return L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
                    }
                }
            } catch (err) {
                console.warn('Błąd geokodowania:', err);
            }
            return null;
        }

        // --- TWORZENIE INTERAKTYWNEGO MARKERA ---
        function createInteractiveMarker(lat, lng, title, rawRowData = {}) {
            const marker = L.circleMarker([lat, lng], {
                radius: 6,
                fillColor: "#7f8c8d",
                color: "#fff",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            });

            marker.markerTitle = title;
            marker.rawRowData = rawRowData;
            marker.assignedRegionName = null;

            // Przygotowanie okna Popup
            const popupContainer = document.createElement('div');
            popupContainer.className = 'popup-container';

            const popupTitle = document.createElement('div');
            popupTitle.className = 'popup-title';
            popupTitle.innerText = title;

            const popupInfo = document.createElement('div');
            popupInfo.className = 'popup-info';
            popupInfo.innerHTML = `Współrzędne: ${lat.toFixed(5)}, ${lng.toFixed(5)}<br>Rejon: <b id="pop-region">Brak</b>`;

            const popupActions = document.createElement('div');
            popupActions.className = 'popup-actions';

            // OPCJA 1: Przesuń/Edytuj ręcznie pozycję
            const btnDrag = document.createElement('button');
            btnDrag.className = 'btn-popup-action';
            btnDrag.innerText = '📌 Włącz przesuwanie';
            btnDrag.addEventListener('click', () => {
                if (!marker.dragging) {
                    // Zamiana CircleMarker na standardowy Marker umożliwiający przeciąganie
                    const currentLatLng = marker.getLatLng();
                    pointsGroup.removeLayer(marker);

                    const draggableMarker = L.marker(currentLatLng, { draggable: true }).addTo(pointsGroup);
                    draggableMarker.markerTitle = marker.markerTitle;
                    draggableMarker.rawRowData = marker.rawRowData;
                    draggableMarker.assignedRegionName = marker.assignedRegionName;

                    draggableMarker.on('dragend', function (e) {
                        recordState();
                        recalculateAllStats();
                        saveToLocalStorage();
                    });

                    // Zastąpienie w tablicy
                    const idx = loadedMarkers.indexOf(marker);
                    if (idx !== -1) loadedMarkers[idx] = draggableMarker;

                    draggableMarker.bindPopup("Pozycja zmieniona ręcznie! Rejon zostanie przeliczony.").openPopup();
                    recalculateAllStats();
                }
            });

            // OPCJA 2: Geokoduj ponownie z ograniczeniem do rejonu
            const btnGeocode = document.createElement('button');
            btnGeocode.className = 'btn-popup-action';
            btnGeocode.style.backgroundColor = '#27ae60';
            btnGeocode.innerText = '🌐 Geokoduj ponownie';

            btnGeocode.addEventListener('click', async () => {
                // Odnajdujemy rejon, w którym znajduje się marker (lub do którego jest przypisany)
                const assignedLayer = drawnItems.getLayers().find(l => 
                    (l instanceof L.Polygon || l instanceof L.Rectangle) && 
                    l.regionName === marker.assignedRegionName
                );

                if (!assignedLayer) {
                    alert(`Punkt nie znajduje się w żadnym narysowanym rejonie. Nie można ograniczyć obszaru.`);
                    return;
                }

                btnGeocode.innerText = '⏳ Szukanie w rejonie...';
                btnGeocode.disabled = true;

                // Przekazujemy warstwę rejonu jako parametr
                const newLatLng = await geocodeAddressLive(marker.markerTitle, assignedLayer);

                if (newLatLng) {
                    recordState();
                    marker.setLatLng(newLatLng);
                    recalculateAllStats();
                    saveToLocalStorage();
                    alert(`Znaleziono nową lokalizację wewnątrz rejonu "${marker.assignedRegionName}" dla: "${marker.markerTitle}"`);
                    marker.closePopup();
                } else {
                    alert(`Nie odnaleziono adresu "${marker.markerTitle}" w granicach rejonu "${marker.assignedRegionName}".`);
                    btnGeocode.innerText = '🌐 Geokoduj ponownie';
                    btnGeocode.disabled = false;
                }
            });

            popupActions.appendChild(btnDrag);
            popupActions.appendChild(btnGeocode);

            popupContainer.appendChild(popupTitle);
            popupContainer.appendChild(popupInfo);
            popupContainer.appendChild(popupActions);

            marker.bindPopup(popupContainer);

            marker.on('popupopen', () => {
                const regEl = document.getElementById('pop-region');
                if (regEl) regEl.innerText = marker.assignedRegionName || "Brak";
            });

            return marker;
        }

        // --- OBSŁUGA TWORZENIA / EDYCJI REJONÓW ---
        let regionCounter = 1;

        function onRegionCreated(e) {
            recordState();
            const layer = e.layer;
            const color = regionColors[(regionCounter - 1) % regionColors.length];
            
            layer.setStyle({
                color: color,
                fillColor: color,
                fillOpacity: 0.3,
                weight: 2
            });

            layer.regionName = `Rejon ${regionCounter++}`;
            layer.regionColor = color;

            drawnItems.addLayer(layer);
            recalculateAllStats();
            saveToLocalStorage();
        }

        function onRegionEdited(e) {
            recordState();
            recalculateAllStats();
            saveToLocalStorage();
        }

        function onRegionDeleted(e) {
            recordState();
            recalculateAllStats();
            saveToLocalStorage();
        }

        // --- PRZELICZANIE STATYSTYK I PRZYPISANIE W TLE (TURF.JS) ---
        function recalculateAllStats() {
            const regionLayers = drawnItems.getLayers().filter(l => l instanceof L.Polygon || l instanceof L.Rectangle);
            
            // Przygotuj obiekty GeoJSON rejonów
            const regionPolygons = regionLayers.map(layer => {
                return {
                    layer: layer,
                    name: layer.regionName,
                    color: layer.regionColor,
                    geoJson: layer.toGeoJSON(),
                    pointsCount: 0
                };
            });

            let totalAssignedPoints = 0;

            // Przypisywanie punktów do rejonów
            loadedMarkers.forEach(marker => {
                const latLng = marker.getLatLng();
                const turfPoint = turf.point([latLng.lng, latLng.lat]);
                let assigned = null;

                for (const reg of regionPolygons) {
                    if (turf.booleanPointInPolygon(turfPoint, reg.geoJson)) {
                        assigned = reg;
                        break;
                    }
                }

                if (assigned) {
                    marker.assignedRegionName = assigned.name;
                    if (marker.setStyle) {
                        marker.setStyle({ fillColor: assigned.color, color: '#fff' });
                    }
                    assigned.pointsCount++;
                    totalAssignedPoints++;
                } else {
                    marker.assignedRegionName = null;
                    if (marker.setStyle) {
                        marker.setStyle({ fillColor: '#7f8c8d', color: '#fff' });
                    }
                }
            });

            // Aktualizacja Statystyk Ogólnych
            document.getElementById('stat-total-points').innerText = `${loadedMarkers.length} / ${totalAssignedPoints}`;

            // Renderowanie Listy Rejonów w panelu bocznym
            renderRegionsListUI(regionPolygons);
        }

        function renderRegionsListUI(regionPolygons) {
            const container = document.getElementById('regions-list');
            container.innerHTML = '';

            if (regionPolygons.length === 0) {
                container.innerHTML = '<div style="font-size: 0.8rem; color: #888; text-align: center;">Narysuj obszar na mapie, aby utworzyć rejon.</div>';
                return;
            }

            regionPolygons.forEach(reg => {
                const item = document.createElement('div');
                item.className = 'region-item';
                item.style.borderLeftColor = reg.color;

                item.innerHTML = `
                    <div class="region-header">
                        <span class="region-name" style="color: ${reg.color}">${reg.name}</span>
                        <button class="btn btn-danger" style="width:auto; padding:2px 6px; margin:0;" onclick="deleteRegionByName('${reg.name}')">🗑️</button>
                    </div>
                    <div class="region-stats">
                        <span>Liczba punktów: <b>${reg.pointsCount}</b></span>
                        <span>Udział: <b>${loadedMarkers.length > 0 ? ((reg.pointsCount / loadedMarkers.length) * 100).toFixed(1) : 0}%</b></span>
                    </div>
                `;

                // Kliknięcie w rejon na liście przybliża do niego mapę
                item.querySelector('.region-name').addEventListener('click', () => {
                    map.fitBounds(reg.layer.getBounds(), { padding: [50, 50] });
                });

                container.appendChild(item);
            });
        }

        window.deleteRegionByName = function(name) {
            recordState();
            drawnItems.getLayers().forEach(layer => {
                if (layer.regionName === name) {
                    drawnItems.removeLayer(layer);
                }
            });
            recalculateAllStats();
            saveToLocalStorage();
        };

        // --- SYSTEM UNDO / REDO (HISTORIA ZMIAN) ---
        function recordState() {
            const state = {
                regions: drawnItems.getLayers().map(l => ({
                    geojson: l.toGeoJSON(),
                    name: l.regionName,
                    color: l.regionColor
                })),
                points: loadedMarkers.map(m => ({
                    lat: m.getLatLng().lat,
                    lng: m.getLatLng().lng,
                    title: m.markerTitle,
                    rawData: m.rawRowData
                }))
            };

            historyStack.push(JSON.stringify(state));
            if (historyStack.length > MAX_HISTORY) historyStack.shift();
            redoStack = []; // Czyszczenie Redo po nowej akcji
        }

        document.getElementById('btn-undo').addEventListener('click', () => {
            if (historyStack.length === 0) return;
            
            // Zapisz aktualny stan do Redo przed cofnięciem
            const currentState = {
                regions: drawnItems.getLayers().map(l => ({
                    geojson: l.toGeoJSON(),
                    name: l.regionName,
                    color: l.regionColor
                })),
                points: loadedMarkers.map(m => ({
                    lat: m.getLatLng().lat,
                    lng: m.getLatLng().lng,
                    title: m.markerTitle,
                    rawData: m.rawRowData
                }))
            };
            redoStack.push(JSON.stringify(currentState));

            const prevState = JSON.parse(historyStack.pop());
            restoreState(prevState);
        });

        document.getElementById('btn-redo').addEventListener('click', () => {
            if (redoStack.length === 0) return;

            const nextState = JSON.parse(redoStack.pop());
            recordState();
            restoreState(nextState);
        });

        function restoreState(state) {
            drawnItems.clearLayers();
            pointsGroup.clearLayers();
            loadedMarkers = [];

            // Przywracanie rejonów
            state.regions.forEach(r => {
                const layer = L.geoJSON(r.geojson, {
                    style: {
                        color: r.color,
                        fillColor: r.color,
                        fillOpacity: 0.3,
                        weight: 2
                    }
                }).getLayers()[0];

                layer.regionName = r.name;
                layer.regionColor = r.color;
                drawnItems.addLayer(layer);
            });

            // Przywracanie punktów
            state.points.forEach(p => {
                const marker = createInteractiveMarker(p.lat, p.lng, p.title, p.rawData);
                pointsGroup.addLayer(marker);
                loadedMarkers.push(marker);
            });

            recalculateAllStats();
            saveToLocalStorage();
        }

        // --- ZAPIS / ODCZYT Z LOCALSTORAGE ---
        function saveToLocalStorage() {
            const dataToSave = {
                regions: drawnItems.getLayers().map(l => ({
                    geojson: l.toGeoJSON(),
                    name: l.regionName,
                    color: l.regionColor
                })),
                points: loadedMarkers.map(m => ({
                    lat: m.getLatLng().lat,
                    lng: m.getLatLng().lng,
                    title: m.markerTitle,
                    rawData: m.rawRowData
                })),
                regionCounter: regionCounter
            };
            localStorage.setItem('konstruktor_rejonow_data', JSON.stringify(dataToSave));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('konstruktor_rejonow_data');
            if (!saved) return;

            try {
                const data = JSON.parse(saved);
                regionCounter = data.regionCounter || 1;
                restoreState(data);
            } catch (e) {
                console.error("Błąd wczytywania z LocalStorage", e);
            }
        }

        // --- EKSPORT DANYCH DO EXCELA ---
        document.getElementById('btn-export-excel').addEventListener('click', () => {
            if (loadedMarkers.length === 0) {
                alert("Brak danych do eksportu!");
                return;
            }

            const exportData = loadedMarkers.map(m => {
                return {
                    ...m.rawRowData,
                    'Szerokość (Lat)': m.getLatLng().lat,
                    'Długość (Lng)': m.getLatLng().lng,
                    'Przypisany Rejon': m.assignedRegionName || 'NIEPRZYPISANE'
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Rejony i Punkty");

            XLSX.writeFile(workbook, `Eksport_Rejonow_${new Date().toISOString().slice(0,10)}.xlsx`);
        });

        // --- CZYSZCZENIE DANYCH ---
        document.getElementById('btn-clear-all').addEventListener('click', () => {
            if (confirm("Czy na pewno chcesz usunąć wszystkie rejony i punkty?")) {
                recordState();
                drawnItems.clearLayers();
                pointsGroup.clearLayers();
                loadedMarkers = [];
                rawData = [];
                regionCounter = 1;
                localStorage.removeItem('konstruktor_rejonow_data');
                recalculateAllStats();
                document.getElementById('header-status').innerText = "Wyczyszczono dane";
            }
        });

        // Uruchomienie mapy po załadowaniu strony
        window.onload = initMap;
    </script>
</body>
</html>
