<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konstruktor Rejonów</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        #sidebar {
            width: 380px;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #2c3e50;
            color: white;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7f8c8d;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .region-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .region-card.active {
            border-color: #3498db;
            background: #f0f7fc;
        }

        .region-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .region-title-input {
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid transparent;
            background: transparent;
            padding: 2px 4px;
            border-radius: 4px;
            width: 180px;
        }

        .region-title-input:hover, .region-title-input:focus {
            background: #ffffff;
            border-color: #ced4da;
        }

        .color-picker {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border: none;
            cursor: pointer;
            border-radius: 50%;
            overflow: hidden;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            color: #555;
            margin-top: 8px;
        }

        .stat-item {
            background: #ffffff;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            display: block;
        }

        .stat-value {
            font-weight: 600;
            color: #2c3e50;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        .empty-state {
            text-align: center;
            color: #95a5a6;
            font-size: 0.9rem;
            padding: 30px 10px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Konstruktor Rejonów</h1>
        </div>
        <div class="sidebar-content">
            <div class="section-title">Lista Rejonów</div>
            <div id="regionsList">
                <div class="empty-state">Brak narysowanych obszarów.<br>Użyj narzędzi po lewej stronie mapy, aby dodać rejon.</div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <script>
        // --- PALETA I Menedżer Kolorów ---
        const REGION_COLORS = [
            "#e74c3c", "#2ecc71", "#3498db", "#f39c12", "#9b59b6", 
            "#1abc9c", "#e84393", "#d35400", "#00cec9", "#6c5ce7",
            "#fdcb6e", "#ff7675", "#a29bfe", "#00b894", "#b2bec3",
            "#e17055", "#0984e3", "#fd79a8", "#6c1200", "#00b16a",
            "#2c3e50", "#8e44ad", "#16a085", "#f1c40f", "#27ae60"
        ];

        function getNextRegionColor() {
            const usedColors = new Set();
            drawnItems.eachLayer(layer => {
                if ((layer instanceof L.Polygon || layer instanceof L.Rectangle) && layer.regionColor) {
                    usedColors.add(layer.regionColor.toLowerCase());
                }
            });

            // 1. Zwróć pierwszy kolor z palety, który nie jest jeszcze użyty na mapie
            for (const color of REGION_COLORS) {
                if (!usedColors.has(color.toLowerCase())) {
                    return color;
                }
            }

            // 2. Jeśli wszystkie 25 kolorów są już na mapie, wygeneruj losowy odcień
            return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        }

        // --- INICJALIZACJA MAPY ---
        const map = L.map('map').setView([52.237049, 21.017532], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        let regionCounter = 1;
        let selectedLayer = null;

        // Narzędzia Rysowania
        const drawControl = new L.Control.Draw({
            draw: {
                polyline: false,
                circle: false,
                circlemarker: false,
                marker: false,
                polygon: {
                    allowIntersection: false,
                    showArea: true
                },
                rectangle: true
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        // --- OBSŁUGA ZDARZEŃ RYSOWANIA ---
        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            drawnItems.addLayer(layer);

            if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                const defaultColor = getNextRegionColor();
                
                layer.setStyle({ color: defaultColor, fillColor: defaultColor, fillOpacity: 0.35, weight: 3 });

                const regionName = `Rejon ${regionCounter++}`;
                layer.regionColor = defaultColor;
                layer.regionName = regionName;
                
                attachLayerEvents(layer);
                rebuildRegionsListUI();
                selectRegion(layer);
            }
        });

        map.on(L.Draw.Event.EDITED, function () {
            rebuildRegionsListUI();
        });

        map.on(L.Draw.Event.DELETED, function () {
            rebuildRegionsListUI();
        });

        // --- POMOCNICZE FUNKCJE OBSŁUGI WARSTW ---
        function attachLayerEvents(layer) {
            layer.on('click', function () {
                selectRegion(layer);
            });
        }

        function selectRegion(layer) {
            selectedLayer = layer;
            rebuildRegionsListUI();
        }

        function calculateAreaSqKm(layer) {
            const geojson = layer.toGeoJSON();
            const areaInSqMeters = turf.area(geojson);
            return (areaInSqMeters / 1000000).toFixed(2);
        }

        // --- INTERFEJS UŻYTKOWNIKA (SIDEBAR) ---
        function rebuildRegionsListUI() {
            const container = document.getElementById('regionsList');
            container.innerHTML = '';

            const layers = drawnItems.getLayers().filter(l => l instanceof L.Polygon || l instanceof L.Rectangle);

            if (layers.length === 0) {
                container.innerHTML = '<div class="empty-state">Brak narysowanych obszarów.<br>Użyj narzędzi po lewej stronie mapy, aby dodać rejon.</div>';
                return;
            }

            layers.forEach(layer => {
                const card = document.createElement('div');
                card.className = `region-card ${selectedLayer === layer ? 'active' : ''}`;
                
                const area = calculateAreaSqKm(layer);

                card.innerHTML = `
                    <div class="region-card-header">
                        <input type="text" class="region-title-input" value="${layer.regionName || 'Rejon'}" />
                        <input type="color" class="color-picker" value="${layer.regionColor || '#3388ff'}" />
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Powierzchnia</span>
                            <span class="stat-value">${area} km²</span>
                        </div>
                        <div class="stat-item" style="display:flex; align-items:center; justify-content:flex-end;">
                            <button class="btn-danger">Usuń</button>
                        </div>
                    </div>
                `;

                // Reakcja na zmianę nazwy
                const nameInput = card.querySelector('.region-title-input');
                nameInput.addEventListener('change', (e) => {
                    layer.regionName = e.target.value;
                });

                // Reakcja na zmianę koloru
                const colorInput = card.querySelector('.color-picker');
                colorInput.addEventListener('input', (e) => {
                    const newColor = e.target.value;
                    layer.regionColor = newColor;
                    layer.setStyle({ color: newColor, fillColor: newColor });
                });

                // Reakcja na usunięcie
                const deleteBtn = card.querySelector('.btn-danger');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    drawnItems.removeLayer(layer);
                    if (selectedLayer === layer) selectedLayer = null;
                    rebuildRegionsListUI();
                });

                // Zaznaczenie po kliknięciu w kartę
                card.addEventListener('click', () => {
                    selectRegion(layer);
                    map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                });

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
