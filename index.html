<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywny Menedżer Rejonów i Punktów</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f8f9fa;
            color: #333;
        }

        #sidebar {
            width: 380px;
            background: #ffffff;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        #sidebar-header {
            padding: 15px;
            background: #2c3e50;
            color: white;
        }

        #sidebar-header h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .stats-summary {
            background: #34495e;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        #controls {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover {
            background: #0b5ed7;
        }

        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #bb2d3b;
        }

        .btn-success {
            background: #198754;
        }
        .btn-success:hover {
            background: #157347;
        }

        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5c636a;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        #regionsList {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .region-card {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-left: 6px solid #3388ff;
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .region-card:hover {
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background: #fff;
        }

        .region-card.selected {
            border-color: #0d6efd;
            background: #e7f1ff;
        }

        .region-card.overlap-warning {
            border-right: 4px solid #ffc107;
        }

        .region-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .region-title-input {
            border: 1px solid transparent;
            background: transparent;
            font-weight: bold;
            font-size: 14px;
            color: #212529;
            width: 70%;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .region-title-input:hover, .region-title-input:focus {
            border-color: #ced4da;
            background: white;
        }

        .region-stats {
            font-size: 12px;
            color: #6c757d;
        }

        .region-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .color-picker {
            -webkit-appearance: none;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 1px solid #ccc;
            border-radius: 50%;
        }

        .overlap-badge {
            font-size: 11px;
            color: #856404;
            background-color: #fff3cd;
            padding: 2px 6px;
            border-radius: 3px;
            display: none;
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        .btn-group .btn {
            flex: 1;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2>Menedżer Rejonów</h2>
            <div class="stats-summary">
                <span>Wszystkie punkty: <b id="totalPointsCount">0</b></span>
                <span>Nieprzypisane: <b id="unassignedCount" style="color: #ffc107;">0</b></span>
            </div>
        </div>

        <div id="controls">
            <div class="file-input-wrapper">
                <button class="btn btn-secondary" style="width: 100%;">📁 Wczytaj plik (XLSX / CSV / KML)</button>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, .kml">
            </div>

            <div class="btn-group">
                <button class="btn btn-success" id="exportXlsxBtn">📥 XLSX</button>
                <button class="btn btn-success" id="exportKmlBtn">🌐 KML</button>
            </div>

            <button class="btn btn-secondary" id="toggleUnassignedBtn">Pokaż tylko nieprzypisane</button>
            <button class="btn btn-danger" id="resetStorageBtn">🗑️ Wyczyść zapamiętane rejony</button>
        </div>

        <div id="regionsList">
            <div id="emptyInfo" style="text-align: center; color: #adb5bd; margin-top: 20px; font-size: 12px;">
                Brak narysowanych rejonów. Wczytaj pliki lub narysuj obszar ręcznie za pomocą narzędzi na mapie.
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Skrypty JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        // --- INICJALIZACJA MAPY ---
        const map = L.map('map').setView([52.237049, 21.017532], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        const markersClusterGroup = L.markerClusterGroup({
            disableClusteringAtZoom: 16,
            spiderfyOnMaxZoom: true
        });
        map.addLayer(markersClusterGroup);

        // --- ZMIENNE GLOBALNE ---
        let allMarkers = [];
        let selectedLayer = null;
        let showOnlyUnassigned = false;

        // --- KONTROLKA LEAFLET.DRAW ---
        const drawControl = new L.Control.Draw({
            draw: {
                polygon: {
                    allowIntersection: false,
                    showArea: true,
                    shapeOptions: { color: '#3388ff' }
                },
                rectangle: {
                    shapeOptions: { color: '#3388ff' }
                },
                circle: false,
                circlemarker: false,
                marker: false,
                polyline: false
            },
            edit: {
                featureGroup: drawnItems,
                remove: false,
                edit: false
            }
        });
        map.addControl(drawControl);

        // --- OBSŁUGA TWORZENIA OBSZARÓW ---
        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            const defaultColor = '#3388ff';
            layer.regionColor = defaultColor;
            layer.setStyle({ color: defaultColor, fillColor: defaultColor, fillOpacity: 0.4 });

            drawnItems.addLayer(layer);
            attachLayerEvents(layer);

            const regionId = 'region_' + Date.now();
            const defaultName = 'Rejon ' + (drawnItems.getLayers().length);

            createRegionCard(regionId, defaultName, 0, layer, defaultColor);
            recalculateAllStats();
            saveToLocalStorage();
            selectRegion(layer);
        });

        function createInteractiveMarker(lat, lng, title) {
            const marker = L.marker([lat, lng]);
            marker.bindPopup(`<b>${escapeXml(title)}</b><br>Lat: ${lat}<br>Lng: ${lng}`);
            marker.isAssigned = false;
            return marker;
        }

        // --- LOGIKA EDYCJI WIERZCHOŁKÓW I SELEKCJI WARSTW ---

        function enablePolygonEdit(layer) {
            if (!layer) return;
            
            if (layer.editing) {
                layer.editing.enable();
            } else if (L.Edit && L.Edit.Poly) {
                layer.editing = new L.Edit.Poly(layer);
                layer.editing.enable();
            }

            layer.off('edit');
            layer.on('edit', () => {
                recalculateAllStats();
                saveToLocalStorage();
            });
        }

        function disablePolygonEdit(layer) {
            if (layer && layer.editing) {
                layer.editing.disable();
            }
        }

        function selectRegion(layer) {
            if (selectedLayer === layer && layer !== null) {
                disablePolygonEdit(selectedLayer);
                if (selectedLayer.regionId) {
                    const card = document.getElementById(selectedLayer.regionId);
                    if (card) card.classList.remove('selected');
                }
                selectedLayer = null;
                return;
            }

            if (selectedLayer) {
                disablePolygonEdit(selectedLayer);
                if (selectedLayer.regionId) {
                    const card = document.getElementById(selectedLayer.regionId);
                    if (card) card.classList.remove('selected');
                }
            }

            selectedLayer = layer;

            if (selectedLayer) {
                enablePolygonEdit(selectedLayer);
                if (selectedLayer.regionId) {
                    const card = document.getElementById(selectedLayer.regionId);
                    if (card) {
                        card.classList.add('selected');
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            }
        }

        function attachLayerEvents(layer) {
            layer.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                selectRegion(layer);
            });
        }

        // --- POMOCNICZE FUNKCJE TEKSTOWE I KOLORÓW ---

        function escapeXml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/[<>&'"]/g, c => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }

        function hexToKmlColor(hex) {
            if (!hex) return "ff0000ff";
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            if (c.length !== 6) return "ff0000ff";
            const r = c.substring(0, 2);
            const g = c.substring(2, 4);
            const b = c.substring(4, 6);
            return `ff${b}${g}${r}`;
        }

        // --- IMPORT I RENDEROWANIE PLIKÓW ---

        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.kml')) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    parseKML(evt.target.result);
                };
                reader.readAsText(file);
            } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.csv')) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    const addedCount = renderTableData(json);
                    document.getElementById('totalPointsCount').innerText = allMarkers.length;
                    recalculateAllStats();

                    if (addedCount > 0) {
                        map.fitBounds(markersClusterGroup.getBounds(), { padding: [30, 30] });
                    }
                };
                reader.readAsArrayBuffer(file);
            }
            e.target.value = '';
        });

        function parseKML(kmlText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(kmlText, "text/xml");
            const placemarks = xmlDoc.getElementsByTagName("Placemark");
            let addedPolygons = 0;

            for (let i = 0; i < placemarks.length; i++) {
                const p = placemarks[i];
                const nameElem = p.getElementsByTagName("name")[0];
                const name = nameElem ? nameElem.textContent.trim() : `Rejon z KML ${i + 1}`;

                const polyElem = p.getElementsByTagName("Polygon")[0];
                if (polyElem) {
                    const coordElem = polyElem.getElementsByTagName("coordinates")[0];
                    if (coordElem) {
                        const coordsText = coordElem.textContent.trim();
                        const points = coordsText.split(/\s+/);
                        const latLngs = [];

                        points.forEach(pt => {
                            const parts = pt.split(',');
                            if (parts.length >= 2) {
                                const lon = parseFloat(parts[0]);
                                const lat = parseFloat(parts[1]);
                                if (!isNaN(lat) && !isNaN(lon)) {
                                    latLngs.push([lat, lon]);
                                }
                            }
                        });

                        if (latLngs.length >= 3) {
                            const defaultColor = '#3388ff';
                            const polygonLayer = L.polygon(latLngs, {
                                color: defaultColor,
                                fillColor: defaultColor,
                                fillOpacity: 0.4,
                                weight: 3
                            });

                            drawnItems.addLayer(polygonLayer);
                            polygonLayer.regionColor = defaultColor;
                            attachLayerEvents(polygonLayer);

                            const regionId = 'region_' + Date.now() + '_' + i;
                            createRegionCard(regionId, name, 0, polygonLayer, defaultColor);
                            addedPolygons++;
                        }
                    }
                }
            }

            if (addedPolygons > 0) {
                recalculateAllStats();
                saveToLocalStorage();
                map.fitBounds(drawnItems.getBounds(), { padding: [30, 30] });
            }
        }

        function renderTableData(rows) {
            const newMarkers = [];
            rows.forEach(row => {
                const latKey = Object.keys(row).find(k => ['lat', 'latitude', 'szerokosc', 'szerokość'].includes(k.trim().toLowerCase()));
                const lonKey = Object.keys(row).find(k => ['long', 'lng', 'longitude', 'dlugosc', 'długość'].includes(k.trim().toLowerCase()));
                const labelKey = Object.keys(row).find(k => ['adres', 'address', 'nazwa', 'name'].includes(k.trim().toLowerCase()));

                if (latKey && lonKey) {
                    const lat = parseFloat(row[latKey]);
                    const lon = parseFloat(row[lonKey]);
                    const label = labelKey ? row[labelKey] : 'Punkt';

                    if (!isNaN(lat) && !isNaN(lon)) {
                        const m = createInteractiveMarker(lat, lon, label);
                        newMarkers.push(m);
                        allMarkers.push(m);
                    }
                }
            });

            markersClusterGroup.addLayers(newMarkers);
            return newMarkers.length;
        }

        // --- PRZELICZANIE PUNKTÓW W REJONACH (TURF.JS) ---

        function recalculateAllStats() {
            const regionLayers = drawnItems.getLayers().filter(l => l instanceof L.Polygon || l instanceof L.Rectangle);
            const regionGeoJSONs = regionLayers.map(layer => ({
                layer: layer,
                geoJSON: layer.toGeoJSON(),
                count: 0
            }));

            let unassignedCount = 0;

            allMarkers.forEach(marker => {
                const latLng = marker.getLatLng();
                const turfPoint = turf.point([latLng.lng, latLng.lat]);
                let isInsideAny = false;

                regionGeoJSONs.forEach(r => {
                    if (turf.booleanPointInPolygon(turfPoint, r.geoJSON)) {
                        r.count++;
                        isInsideAny = true;
                    }
                });

                marker.isAssigned = isInsideAny;
                if (!isInsideAny) unassignedCount++;
            });

            regionGeoJSONs.forEach(r => {
                if (r.layer.regionId) {
                    const card = document.getElementById(r.layer.regionId);
                    if (card) {
                        card.querySelector('.point-count').innerText = r.count;
                    }
                }
            });

            const unassignedElem = document.getElementById('unassignedCount');
            if (unassignedElem) unassignedElem.innerText = unassignedCount;

            regionGeoJSONs.forEach(r => {
                const card = document.getElementById(r.layer.regionId);
                if (!card) return;

                let hasOverlap = false;
                regionGeoJSONs.forEach(other => {
                    if (r.layer !== other.layer) {
                        const intersection = turf.intersect(r.geoJSON, other.geoJSON);
                        if (intersection) hasOverlap = true;
                    }
                });

                const badge = card.querySelector('.overlap-badge');
                if (hasOverlap) {
                    card.classList.add('overlap-warning');
                    if (badge) badge.style.display = 'block';
                } else {
                    card.classList.remove('overlap-warning');
                    if (badge) badge.style.display = 'none';
                }
            });

            if (showOnlyUnassigned) filterUnassignedMarkers();
        }

        const toggleUnassignedBtn = document.getElementById('toggleUnassignedBtn');
        if (toggleUnassignedBtn) {
            toggleUnassignedBtn.addEventListener('click', () => {
                showOnlyUnassigned = !showOnlyUnassigned;
                if (showOnlyUnassigned) {
                    toggleUnassignedBtn.innerText = 'Pokaż wszystkie punkty';
                    filterUnassignedMarkers();
                } else {
                    toggleUnassignedBtn.innerText = 'Pokaż tylko nieprzypisane';
                    markersClusterGroup.clearLayers();
                    markersClusterGroup.addLayers(allMarkers);
                }
            });
        }

        function filterUnassignedMarkers() {
            const unassigned = allMarkers.filter(m => !m.isAssigned);
            markersClusterGroup.clearLayers();
            markersClusterGroup.addLayers(unassigned);
        }

        // --- TWORZENIE KART REJONÓW W PANELU BOCZNYM ---

        function createRegionCard(id, defaultName, count, layer, color) {
            const emptyInfo = document.getElementById('emptyInfo');
            if (emptyInfo) emptyInfo.style.display = 'none';

            layer.regionId = id;

            const card = document.createElement('div');
            card.className = 'region-card';
            card.id = id;
            card.style.borderLeftColor = color;

            card.innerHTML = `
                <div class="region-card-header">
                    <input type="text" class="region-title-input" value="${escapeXml(defaultName)}">
                </div>
                <div class="region-stats">
                    📍 Liczba punktów: <b class="point-count">${count}</b>
                </div>
                <div class="overlap-badge" style="display:none;">⚠️ Rejon nachodzi na inny!</div>
                <div class="region-controls">
                    <div class="color-picker-wrapper">
                        <input type="color" class="color-picker" value="${color}">
                        <span>Kolor</span>
                    </div>
                    <button class="btn btn-zoom">🔍 Wyśrodkuj</button>
                    <button class="btn btn-delete">🗑️</button>
                </div>
            `;

            card.addEventListener('click', (evt) => {
                if (!evt.target.classList.contains('region-title-input') && 
                    !evt.target.classList.contains('color-picker') && 
                    !evt.target.classList.contains('btn-delete') &&
                    !evt.target.classList.contains('btn-zoom')) {
                    selectRegion(layer);
                }
            });

            const titleInput = card.querySelector('.region-title-input');
            titleInput.addEventListener('change', () => {
                saveToLocalStorage();
            });

            const colorPicker = card.querySelector('.color-picker');
            colorPicker.addEventListener('input', (evt) => {
                const newColor = evt.target.value;
                layer.regionColor = newColor;
                layer.setStyle({ color: newColor, fillColor: newColor });
                card.style.borderLeftColor = newColor;
                saveToLocalStorage();
            });

            card.querySelector('.btn-zoom').addEventListener('click', (e) => {
                e.stopPropagation();
                map.fitBounds(layer.getBounds(), { padding: [30, 30] });
                selectRegion(layer);
            });

            card.querySelector('.btn-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedLayer === layer) selectRegion(null);
                drawnItems.removeLayer(layer);
                card.remove();
                recalculateAllStats();
                saveToLocalStorage();
            });

            document.getElementById('regionsList').appendChild(card);
        }

        // --- ZAPIS / ODCZYT LOCALSTORAGE ---

        function saveToLocalStorage() {
            const dataToSave = [];
            drawnItems.eachLayer(layer => {
                if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                    const card = layer.regionId ? document.getElementById(layer.regionId) : null;
                    const name = card ? card.querySelector('.region-title-input').value : 'Rejon';
                    dataToSave.push({
                        id: layer.regionId,
                        name: name,
                        color: layer.regionColor || '#3388ff',
                        latLngs: layer.getLatLngs()
                    });
                }
            });
            localStorage.setItem('saved_map_regions', JSON.stringify(dataToSave));
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem('saved_map_regions');
            if (!raw) return;

            try {
                const regions = JSON.parse(raw);
                regions.forEach(r => {
                    const polygonLayer = L.polygon(r.latLngs, {
                        color: r.color,
                        fillColor: r.color,
                        fillOpacity: 0.4,
                        weight: 3
                    });

                    drawnItems.addLayer(polygonLayer);
                    polygonLayer.regionColor = r.color;
                    attachLayerEvents(polygonLayer);

                    createRegionCard(r.id, r.name, 0, polygonLayer, r.color);
                });

                if (regions.length > 0) {
                    recalculateAllStats();
                    map.fitBounds(drawnItems.getBounds(), { padding: [30, 30] });
                }
            } catch (err) {
                console.error("Błąd wczytywania z localStorage:", err);
            }
        }

        document.getElementById('resetStorageBtn').addEventListener('click', () => {
            if (confirm('Czy na pewno chcesz wyczyścić wszystkie zapamiętane rejony z pamięci przeglądarki?')) {
                localStorage.removeItem('saved_map_regions');
                drawnItems.clearLayers();
                document.getElementById('regionsList').innerHTML = `
                    <div id="emptyInfo" style="text-align: center; color: #adb5bd; margin-top: 20px; font-size: 12px;">
                        Brak narysowanych rejonów. Wczytaj pliki lub narysuj obszar ręcznie za pomocą narzędzi na mapie.
                    </div>
                `;
                recalculateAllStats();
            }
        });

        // --- EKSPORT DANYCH (XLSX / KML) ---

        document.getElementById('exportXlsxBtn').addEventListener('click', () => {
            const layers = drawnItems.getLayers().filter(l => l instanceof L.Polygon || l instanceof L.Rectangle);
            if (layers.length === 0) {
                alert('Brak rejonów do wyeksportowania!');
                return;
            }

            const exportData = layers.map((layer, index) => {
                const card = layer.regionId ? document.getElementById(layer.regionId) : null;
                const regionName = card ? card.querySelector('.region-title-input').value : `Rejon ${index + 1}`;
                const pointCount = card ? parseInt(card.querySelector('.point-count').innerText) || 0 : 0;

                return {
                    "Nazwa rejonu": regionName,
                    "Liczba punktów": pointCount
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Podsumowanie");

            XLSX.writeFile(workbook, `podsumowanie_rejonow_${new Date().toISOString().slice(0,10)}.xlsx`);
        });

        document.getElementById('exportKmlBtn').addEventListener('click', () => {
            const layers = drawnItems.getLayers().filter(l => l instanceof L.Polygon || l instanceof L.Rectangle);
            if (layers.length === 0) {
                alert('Brak rejonów do wyeksportowania!');
                return;
            }

            let kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/22">
  <Document>
    <name>Wyeksportowane Rejony</name>\n`;

            layers.forEach((layer, index) => {
                const card = layer.regionId ? document.getElementById(layer.regionId) : null;
                const inputName = card ? card.querySelector('.region-title-input').value : null;
                const regionName = inputName || `Rejon ${index + 1}`;

                const hexColor = layer.regionColor || "#3388ff";
                const kmlColor = hexToKmlColor(hexColor);

                const rawLatLngs = layer.getLatLngs();
                const latLngs = Array.isArray(rawLatLngs[0]) ? rawLatLngs[0] : rawLatLngs;
                
                let coordsString = "";
                latLngs.forEach(ll => {
                    coordsString += `${ll.lng},${ll.lat},0 `;
                });
                if (latLngs.length > 0) {
                    coordsString += `${latLngs[0].lng},${latLngs[0].lat},0`;
                }

                const styleId = `style_${layer.regionId || index}`;

                kmlContent += `    <Style id="${styleId}">
      <LineStyle>
        <color>${kmlColor}</color>
        <width>3</width>
      </LineStyle>
      <PolyStyle>
        <color>66${kmlColor.substring(2)}</color>
      </PolyStyle>
    </Style>
    <Placemark>
      <name>${escapeXml(regionName)}</name>
      <styleUrl>#${styleId}</styleUrl>
      <Polygon>
        <outerBoundaryIs>
          <LinearRing>
            <coordinates>${coordsString.trim()}</coordinates>
          </LinearRing>
        </outerBoundaryIs>
      </Polygon>
    </Placemark>\n`;
            });

            kmlContent += `  </Document>
</kml>`;

            const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rejony_${new Date().toISOString().slice(0,10)}.kml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Wczytanie zapamiętanych danych z przeglądarki
        loadFromLocalStorage();
    </script>
</body>
</html>
