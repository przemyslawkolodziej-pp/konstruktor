<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konstruktor Rejonów</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }

        /* Modal / Okno nieprzypisanych punktów */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-card {
            background: #fff; width: 600px; max-width: 90%; max-height: 85vh;
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            padding: 16px 20px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;
            display: flex; flex-direction: column; gap: 8px;
        }
        .modal-header-top {
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 18px; color: #333; }
        .modal-close {
            background: none; border: none; font-size: 20px; cursor: pointer; color: #666;
        }
        .modal-body {
            padding: 15px 20px; overflow-y: auto; flex: 1;
        }
        .modal-footer {
            padding: 12px 20px; background: #f8f9fa; border-top: 1px solid #dee2e6;
            text-align: right;
        }

        /* Elementy listy grup */
        .group-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; margin-bottom: 8px; background: #f8f9fa;
            border: 1px solid #e9ecef; border-radius: 6px;
        }
        .group-info { display: flex; flex-direction: column; gap: 2px; }
        .group-info b { font-size: 14px; color: #212529; }
        .group-info span { font-size: 12px; color: #6c757d; }
        .group-controls { display: flex; align-items: center; gap: 8px; }
        .group-controls select {
            padding: 6px 8px; font-size: 12px; border: 1px solid #ced4da; border-radius: 4px;
        }
        .btn-assign-group {
            padding: 6px 12px; font-size: 12px; background: #0d6efd; color: #fff;
            border: none; border-radius: 4px; cursor: pointer;
        }
        .btn-assign-group:hover { background: #0b5ed7; }
        
        .btn-secondary {
            padding: 8px 16px; font-size: 13px; background: #6c757d; color: white;
            border: none; border-radius: 4px; cursor: pointer;
        }
        .btn-secondary:hover { background: #5c636a; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- MODAL DO OBSŁUGI NIEPRZYPISANYCH PUNKTÓW -->
    <div id="unassignedModal" class="modal-backdrop">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-header-top">
                    <h3>Punkty poza rejonami</h3>
                    <button class="modal-close" onclick="closeUnassignedModal()">&times;</button>
                </div>
                <!-- POLE WYSZUKIWANIA I SORTOWANIE -->
                <div style="padding: 10px 0 0 0; display: flex; gap: 8px;">
                    <input type="text" id="searchUnassignedGroupsInput" placeholder="🔍 Szukaj ulicy / nazwy..." style="flex: 1; padding: 8px 10px; font-size: 12px; border: 1px solid #ced4da; border-radius: 4px;">
                    <select id="sortUnassignedGroupsSelect" style="padding: 8px 10px; font-size: 12px; border: 1px solid #ced4da; border-radius: 4px; background: white;">
                        <option value="count-desc">Liczba punktów (malejąco)</option>
                        <option value="count-asc">Liczba punktów (rosnąco)</option>
                        <option value="name-asc">Nazwa (A-Z)</option>
                        <option value="name-desc">Nazwa (Z-A)</option>
                    </select>
                </div>
            </div>
            <div class="modal-body" id="unassignedGroupsList">
                <!-- TUTAJ RENDERUJĄ SIĘ GRUPY -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeUnassignedModal()">Zamknij</button>
            </div>
        </div>
    </div>

    <!-- LEAFLET I LEAFLET DRAW JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        // FUNKCJA POMOCNICZA DO ZABEZPIECZANIA KODU HTML
        function escapeXml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // INICJALIZACJA MAPY
        const map = L.map('map').setView([52.2297, 21.0122], 12); // Domyślnie Warszawa

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // ZMIENNE GŁÓWNE
        let allMarkers = []; // Tablica punktów { markerTitle, lat, lng, isAssigned, markerInstance }
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // KONTROLKI LEAFLET.DRAW
        const drawControl = new L.Control.Draw({
            edit: {
                featureGroup: drawnItems
            },
            draw: {
                polygon: true,
                rectangle: true,
                polyline: false,
                circle: false,
                circlemarker: false,
                marker: false
            }
        });
        map.addControl(drawControl);

        // TWORZENIE NOWEGO REJONU (POLIGONU)
        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            const regionName = prompt("Podaj nazwę nowego rejonu:", "Rejon " + (drawnItems.getLayers().length + 1));
            
            if (regionName) {
                layer.regionName = regionName;
                layer.bindPopup("<b>" + escapeXml(regionName) + "</b>");
                drawnItems.addLayer(layer);
                updateAssignments();
            }
        });

        map.on(L.Draw.Event.EDITED, updateAssignments);
        map.on(L.Draw.Event.DELETED, updateAssignments);

        // AKTUALIZACJA PRZYPISANIA PUNKTÓW DO REJONÓW NA PODSTAWIE GEOMETRII
        function updateAssignments() {
            const polygons = drawnItems.getLayers().filter(l => l instanceof L.Polygon || l instanceof L.Rectangle);

            allMarkers.forEach(m => {
                let assigned = false;
                const pt = L.latLng(m.lat, m.lng);

                for (let poly of polygons) {
                    if (isPointInPolygon(pt, poly.getLatLngs()[0])) {
                        assigned = true;
                        m.assignedRegion = poly.regionName;
                        break;
                    }
                }

                m.isAssigned = assigned;
                if (!assigned) {
                    m.assignedRegion = null;
                }
            });
        }

        // ALGORYTM SPRAWDZANIA CZY PUNKT JEST W WEWNĄTRZ POLIGONU
        function isPointInPolygon(latLng, polyLatLngs) {
            let x = latLng.lat, y = latLng.lng;
            let inside = false;
            for (let i = 0, j = polyLatLngs.length - 1; i < polyLatLngs.length; j = i++) {
                let xi = polyLatLngs[i].lat, yi = polyLatLngs[i].lng;
                let xj = polyLatLngs[j].lat, yj = polyLatLngs[j].lng;

                let intersect = ((yi > y) !== (yj > y)) &&
                    (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // MODAL I OBSŁUGA SORTOWANIA / WYSZUKIWANIA
        const unassignedModal = document.getElementById('unassignedModal');
        const searchInput = document.getElementById('searchUnassignedGroupsInput');
        const sortUnassignedGroupsSelect = document.getElementById('sortUnassignedGroupsSelect');

        if (searchInput) {
            searchInput.addEventListener('input', filterUnassignedGroups);
        }

        if (sortUnassignedGroupsSelect) {
            sortUnassignedGroupsSelect.addEventListener('change', openUnassignedModal);
        }

        function openUnassignedModal() {
            const unassigned = allMarkers.filter(m => !m.isAssigned);
            if (unassigned.length === 0) {
                alert('Brak nieprzypisanych punktów!');
                return;
            }

            // Grupujemy punkty po nazwie/ulicy
            const groups = {};
            unassigned.forEach(m => {
                const title = m.markerTitle || 'Brak nazwy/adresu';
                if (!groups[title]) groups[title] = [];
                groups[title].push(m);
            });

            const regionLayers = drawnItems.getLayers().filter(l => l instanceof L.Polygon || l instanceof L.Rectangle);
            const regionNames = Array.from(new Set(regionLayers.map(l => l.regionName || 'Bez nazwy')));

            const container = document.getElementById('unassignedGroupsList');
            container.innerHTML = '';

            if (regionNames.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Narysuj najpierw przynajmniej jeden rejon, aby móc przypisać punkty.</div>';
                unassignedModal.style.display = 'flex';
                return;
            }

            // SORTOWANIE GRUP
            const sortMode = sortUnassignedGroupsSelect ? sortUnassignedGroupsSelect.value : 'count-desc';
            let sortedKeys = Object.keys(groups);

            sortedKeys.sort((a, b) => {
                const countA = groups[a].length;
                const countB = groups[b].length;

                if (sortMode === 'count-desc') return countB - countA;
                if (sortMode === 'count-asc') return countA - countB;
                if (sortMode === 'name-asc') return a.localeCompare(b, 'pl');
                if (sortMode === 'name-desc') return b.localeCompare(a, 'pl');
                return 0;
            });

            // RENDEROWANIE POSORTOWANEJ LISTY
            sortedKeys.forEach((groupTitle, idx) => {
                const markersInGroup = groups[groupTitle];
                const div = document.createElement('div');
                div.className = 'group-item';
                div.setAttribute('data-group-title', groupTitle.toLowerCase());
                
                const optionsHtml = regionNames.map(r => `<option value="${escapeXml(r)}">${escapeXml(r)}</option>`).join('');

                div.innerHTML = `
                    <div class="group-info">
                        <b>${escapeXml(groupTitle)}</b>
                        <span>Liczba punktów w grupie: ${markersInGroup.length}</span>
                    </div>
                    <div class="group-controls">
                        <select id="select-group-${idx}">
                            ${optionsHtml}
                        </select>
                        <button class="btn-assign-group" data-group-title="${escapeXml(groupTitle)}" data-select-id="select-group-${idx}">Przypisz</button>
                    </div>
                `;
                container.appendChild(div);
            });

            container.querySelectorAll('.btn-assign-group').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const title = e.target.getAttribute('data-group-title');
                    const selectId = e.target.getAttribute('data-select-id');
                    const selectEl = document.getElementById(selectId);
                    if (selectEl) {
                        assignGroupToRegion(title, selectEl.value);
                    }
                });
            });

            // Reaplikujemy filtrowanie tekstowe po przeładowaniu/przesortowaniu
            filterUnassignedGroups();

            unassignedModal.style.display = 'flex';
        }

        function closeUnassignedModal() {
            unassignedModal.style.display = 'none';
        }

        function filterUnassignedGroups() {
            const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const items = document.querySelectorAll('#unassignedGroupsList .group-item');
            
            items.forEach(item => {
                const title = item.getAttribute('data-group-title') || '';
                if (title.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // RĘCZNE PRZYPISANIE CAŁEJ GRUPY DANEJ ULICY DO REJONU
        function assignGroupToRegion(groupTitle, targetRegionName) {
            allMarkers.forEach(m => {
                if ((m.markerTitle || 'Brak nazwy/adresu') === groupTitle) {
                    m.isAssigned = true;
                    m.assignedRegion = targetRegionName;
                }
            });

            alert(`Przypisano punkty z grupy "${groupTitle}" do rejonu: ${targetRegionName}`);
            
            // Odświeżamy okno po przypisaniu
            openUnassignedModal();
        }
    </script>
</body>
</html>
