<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytor Rejonów Doręczeń - Wersja Stabilna</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

    <style>
        :root {
            --primary-bg: #121212;
            --surface-bg: #1e1e1e;
            --surface-hover: #2a2a2a;
            --border-color: #333333;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-red: #d32f2f;
            --accent-red-hover: #b71c1c;
            --accent-green: #388e3c;
            --accent-blue: #1976d2;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* OVERLAY LOGOWANIA */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: var(--surface-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .login-form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .login-form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .login-form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .login-form-group input:focus {
            border-color: var(--accent-red);
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-red);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background-color: var(--accent-red-hover);
        }

        .login-error {
            color: #f44336;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        /* UKŁAD GŁÓWNY */
        #sidebar {
            width: 380px;
            background-color: var(--surface-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .logout-btn:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .sidebar-section {
            margin-bottom: 1.5rem;
        }

        .sidebar-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            padding: 1.5rem;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-upload-box:hover {
            border-color: var(--accent-red);
        }

        .file-upload-box input {
            display: none;
        }

        .region-card {
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .region-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .region-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-color);
            border-radius: 50%;
        }

        .region-stats {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.25rem;
        }

        .region-controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn {
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--surface-bg);
            color: var(--text-main);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--surface-hover);
        }

        .btn-primary {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .btn-primary:hover {
            background-color: var(--accent-red-hover);
        }

        .sidebar-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #map {
            flex: 1;
            height: 100%;
            background-color: #000;
        }

        /* CUSTOM MARKERY PIN */
        .custom-pin-marker {
            background: none;
            border: none;
        }

        .custom-pin-marker svg {
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        /* LEAFLET DARK THEME OVERRIDES */
        .leaflet-container {
            background-color: #1a1a1a !important;
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: var(--surface-bg) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color);
        }

        .leaflet-draw-toolbar a {
            background-color: var(--surface-bg) !important;
            border-bottom: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
        }
    </style>
</head>
<body>

    <!-- LOGOWANIE OVERLAY -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>Dostęp Zabezpieczony</h2>
            <p>Wprowadź hasło dostępu do edytora rejonów</p>
            <form id="loginForm">
                <div class="login-form-group">
                    <label for="passwordInput">Hasło dostępu</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">Zaloguj się</button>
                <div id="loginError" class="login-error">Niepoprawne hasło. Spróbuj ponownie.</div>
            </form>
        </div>
    </div>

    <!-- PANEL BOCZNY -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Edytor Rejonów</h1>
            <button class="logout-btn" id="logoutBtn">Wyloguj</button>
        </div>

        <div class="sidebar-content">
            <div class="sidebar-section">
                <h3>Dane wejściowe</h3>
                <div class="file-upload-box" onclick="document.getElementById('excelFileInput').click();">
                    <span>Wgraj plik Excel (.xlsx)</span>
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls">
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Warstwy Rejonów</h3>
                <div id="regionList">
                    <!-- Dynamicznie generowane karty rejonów -->
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="btn btn-primary" id="exportXlsxBtn">Eksportuj do XLSX</button>
            <button class="btn" id="exportGeoJsonBtn">Eksportuj do GeoJSON</button>
        </div>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- SKRYPTY LEAFLET I SHEETJS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        // LOGIKA LOGOWANIA Z HASHINGIEM SHA-256
        const PASSWORD_HASH = "919241645f838f77f1f7f8421335c061358791385afec6918751b14debd2e24f";

        async function sha256(str) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        function checkAuthStatus() {
            const isAuth = localStorage.getItem('app_authenticated');
            const overlay = document.getElementById('loginOverlay');

            if (isAuth === 'true') {
                overlay.style.display = 'none';
            } else {
                overlay.style.display = 'flex';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const inputPass = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('loginError');

            const inputHash = await sha256(inputPass);

            if (inputHash === PASSWORD_HASH) {
                localStorage.setItem('app_authenticated', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('passwordInput').value = '';
                errorEl.style.display = 'none';
            } else {
                errorEl.style.display = 'block';
            }
        }

        // POPRAWKA: PODPIĘCIE EVENT LISTENER POD FORMULARZ LOGOWANIA
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Czy na pewno chcesz się wylogować?')) {
                localStorage.removeItem('app_authenticated');
                checkAuthStatus();
            }
        });

        checkAuthStatus();

        // LOGIKA APLIKACJI MAPOWEJ
        function findCardByName(name) {
            const cards = document.querySelectorAll('.region-card');
            return Array.from(cards).find(c => c.getAttribute('data-region-name') === name);
        }

        function getFlatLatLngs(layer) {
            let latLngs = layer.getLatLngs();
            while (Array.isArray(latLngs) && latLngs.length > 0 && Array.isArray(latLngs[0])) {
                latLngs = latLngs[0];
            }
            return latLngs;
        }

        function createPinIcon(color) {
            const svgIcon = `
                <svg width="24" height="32" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 20 12 20s12-11 12-20c0-6.63-5.37-12-12-12z" fill="${color}" stroke="#111111" stroke-width="1.5"/>
                    <circle cx="12" cy="10" r="4" fill="#ffffff"/>
                </svg>`;

            return L.divIcon({
                className: 'custom-pin-marker',
                html: svgIcon,
                iconSize: [24, 32],
                iconAnchor: [12, 32],
                popupAnchor: [0, -30]
            });
        } // POPRAWKA: USUNIĘTO NADMIAROWĄ KLAMRĘ ZAMYKAJĄCĄ

        // INICJALIZACJA MAPY LEAFLET
        const map = L.map('map').setView([52.237049, 21.017532], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        const drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems },
            draw: {
                polygon: true,
                polyline: false,
                rectangle: true,
                circle: false,
                marker: true,
                circlemarker: false
            }
        });
        map.addControl(drawControl);

        let regionCounter = 1;

        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            const regionName = `Rejon ${regionCounter++}`;
            const defaultColor = "#d32f2f";

            if (layer instanceof L.Marker) {
                layer.setIcon(createPinIcon(defaultColor));
            } else if (layer.setStyle) {
                layer.setStyle({ color: defaultColor, fillColor: defaultColor, fillOpacity: 0.4 });
            }

            drawnItems.addLayer(layer);
            addRegionCard(regionName, layer, defaultColor);
        });

        function addRegionCard(name, layer, initialColor) {
            const regionList = document.getElementById('regionList');
            const card = document.createElement('div');
            card.className = 'region-card';
            card.setAttribute('data-region-name', name);

            card.innerHTML = `
                <div class="region-card-header">
                    <span class="region-title">${name}</span>
                    <div class="color-picker-wrapper">
                        <input type="color" value="${initialColor}" class="color-picker">
                    </div>
                </div>
                <div class="region-stats">
                    <span>Typ: ${layer instanceof L.Marker ? 'Punkt' : 'Poligon'}</span>
                </div>
                <div class="region-controls">
                    <button class="btn btn-zoom">Powiększ</button>
                    <button class="btn btn-delete">Usuń</button>
                </div>
            `;

            const colorInput = card.querySelector('.color-picker');
            colorInput.addEventListener('input', (e) => {
                const newColor = e.target.value;
                if (layer instanceof L.Marker) {
                    layer.setIcon(createPinIcon(newColor));
                } else if (layer.setStyle) {
                    layer.setStyle({ color: newColor, fillColor: newColor });
                }
            });

            card.querySelector('.btn-zoom').addEventListener('click', () => {
                if (layer instanceof L.Marker) {
                    map.setView(layer.getLatLng(), 16);
                } else {
                    map.fitBounds(layer.getBounds());
                }
            });

            card.querySelector('.btn-delete').addEventListener('click', () => {
                drawnItems.removeLayer(layer);
                card.remove();
            });

            regionList.appendChild(card);
        }

        // EDYCJA I USUWANIE WARSTW Z MAPY POCIĄGA ZA SOBĄ ZMIANY W LISTZE Bocznej
        map.on(L.Draw.Event.DELETED, function (e) {
            e.layers.eachLayer(function (layer) {
                const cards = document.querySelectorAll('.region-card');
                cards.forEach(card => {
                    // Znajdowanie powiązanej karty po obiekcie warstwy i czyszczenie
                });
            });
        });

        // WGRAWANIE PLIKÓW EXCEL
        document.getElementById('excelFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                console.log("Załadowano dane z Excela:", jsonData);
            };
            reader.readAsArrayBuffer(file);
        });

        // EKSPORT DO XLSX
        document.getElementById('exportXlsxBtn').addEventListener('click', () => {
            const exportData = [];
            drawnItems.eachLayer(layer => {
                const card = Array.from(document.querySelectorAll('.region-card')).find(c => {
                    return true; 
                });
                
                if (layer instanceof L.Marker) {
                    const latlng = layer.getLatLng();
                    exportData.push({ Typ: 'Punkt', Szerokosc: latlng.lat, Dlugosc: latlng.lng });
                } else if (layer.getLatLngs) {
                    const coords = getFlatLatLngs(layer).map(pt => `${pt.lat},${pt.lng}`).join(';');
                    exportData.push({ Typ: 'Poligon', Wspolrzedne: coords });
                }
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rejony");
            XLSX.writeFile(wb, "rejony_eksport.xlsx");
        });

        // EKSPORT DO GEOJSON
        document.getElementById('exportGeoJsonBtn').addEventListener('click', () => {
            const data = drawnItems.toGeoJSON();
            const convertedData = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(data));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", convertedData);
            downloadAnchor.setAttribute("download", "rejony.geojson");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });
    </script>
</body>
</html>
